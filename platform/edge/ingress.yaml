# HAProxy nhận traffic từ CMC Load Balancer, chuyển MỌI host vào Kong.
# Không gắn host ở đây: Kong định tuyến theo host/path (kong-routes trong apps/*/base, host đặt ở overlay),
# TLS dùng chứng chỉ mặc định của HAProxy (secret cloudflare-origin-tls, xem platform/haproxy-ingress/values.yaml).
# Đổi tên miền chỉ cần sửa overlay, không sửa file này.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge
  namespace: kong
  annotations:
    haproxy.org/timeout-tunnel: "3600s"
spec:
  ingressClassName: haproxy
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-proxy
                port:
                  number: 80
