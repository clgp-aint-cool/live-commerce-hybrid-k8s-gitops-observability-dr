# Plugin prometheus toàn cục: Kong xuất kong_http_requests_total{service="<ns>.<svc>.<port>"} ở cổng status 8100.
# Global: áp cho mọi route, không cần annotation konghq.com/plugins. Prometheus prometheus-hpa (ns monitoring) scrape từng pod Kong.
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: prometheus
  annotations:
    kubernetes.io/ingress.class: kong   # thiếu thì Kong Ingress Controller bỏ qua plugin
  labels:
    global: "true"
plugin: prometheus
config:
  status_code_metrics: true   # bật kong_http_requests_total (Kong 3.x mặc định tắt)
  latency_metrics: true
