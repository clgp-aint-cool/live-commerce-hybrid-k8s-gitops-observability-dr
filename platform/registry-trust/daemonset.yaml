# Ghi /etc/containerd/certs.d/<registry>/{ca.crt,hosts.toml} lên từng node.
# containerd đọc hosts.toml mỗi lần pull (khi registry config_path trỏ tới /etc/containerd/certs.d),
# nên KHÔNG cần restart containerd. Pod giữ chạy để node mới (autoscale) cũng được cấu hình.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: harbor-ca-installer
  labels:
    app: harbor-ca-installer
spec:
  selector:
    matchLabels:
      app: harbor-ca-installer
  template:
    metadata:
      labels:
        app: harbor-ca-installer
    spec:
      tolerations:
        - operator: Exists # chạy trên mọi node group, kể cả node có taint
      containers:
        - name: installer
          image: busybox:1.36 # từ Docker Hub: không thể kéo từ Harbor khi node chưa tin Harbor
          command:
            - sh
            - -c
            - |
              set -e
              for reg in 192.168.6.194 harbor.cmc-cloud-hcm1.cloud; do
                d=/host/etc/containerd/certs.d/$reg
                mkdir -p "$d"
                cp /ca/ca.crt "$d/ca.crt"
                printf '%s\n' \
                  "server = \"https://$reg\"" \
                  "" \
                  "[host.\"https://$reg\"]" \
                  "  capabilities = [\"pull\", \"resolve\"]" \
                  "  ca = \"/etc/containerd/certs.d/$reg/ca.crt\"" > "$d/hosts.toml"
                echo "ok   $NODE: $d/hosts.toml"
              done
              cfg=/host/etc/containerd/config.toml
              grep -q 'harbor.cmc-cloud-hcm1.cloud' /host/etc/hosts || echo '192.168.6.194 harbor.cmc-cloud-hcm1.cloud' >> /host/etc/hosts
              if [ -f "$cfg" ]; then
                if grep -q 'config_path' "$cfg"; then
                  echo "info $NODE: $(grep 'config_path' "$cfg" | tr -s ' ')"
                else
                  echo "WARN $NODE: config.toml không đặt config_path. containerd 2.x mặc định đọc /etc/containerd/certs.d; containerd 1.x thì KHÔNG (xem docs mục 2.3)"
                fi
                grep -q 'registry.configs\|registry.mirrors' "$cfg" && echo "WARN $NODE: config.toml còn registry.configs/mirrors kiểu cũ, có thể làm containerd bỏ qua certs.d" || true
              fi
              while true; do sleep 3600; done
          env:
            - name: NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - name: containerd
              mountPath: /host/etc/containerd
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: hosts
              mountPath: /host/etc/hosts

      volumes:
        - name: containerd
          hostPath:
            path: /etc/containerd
            type: DirectoryOrCreate
        - name: ca
          configMap:
            name: harbor-ca
        - name: hosts
          hostPath: {path: /etc/hosts, type: File}
