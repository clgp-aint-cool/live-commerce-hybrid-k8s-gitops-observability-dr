# Bot "nhận ticket" cho kênh alert Discord. Token bot + role ID là Secret riêng (không commit), xem README.md.
#   kubectl apply -k platform/monitoring/alert-bot
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - deployment.yaml

configMapGenerator:
  - name: alert-bot-code      # có hash suffix: sửa bot.py → Deployment tự rollout
    files:
      - bot.py
