apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-bot
  labels: {app.kubernetes.io/name: alert-bot, app.kubernetes.io/part-of: live-commerce-observability}
spec:
  replicas: 1                 # đúng 1: 2 bản sẽ trả lời mỗi alert 2 lần
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: alert-bot}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alert-bot}
    spec:
      nodeSelector: {dedicated: monitor}
      tolerations:
        - {key: dedicated, operator: Equal, value: monitor, effect: NoSchedule}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: bot
          image: python:3.12-slim
          # Cài discord.py lúc khởi động (không cần build/push image); chỉ ~5 MB, cần Internet ra PyPI.
          command: [sh, -c, "pip install --quiet --no-cache-dir --target /deps discord.py==2.4.0 && exec python -u /app/bot.py"]
          env:
            - {name: PYTHONPATH, value: /deps}
            - {name: HOME, value: /tmp}
            - {name: ALERT_CHANNELS, value: "alert-critical,alert-warning,alert-trust-safety"}
          envFrom:
            - secretRef: {name: alert-bot-discord}   # DISCORD_BOT_TOKEN, DISCORD_ROLE_ONCALL, DISCORD_ROLE_TRUST_SAFETY
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 192Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: deps, mountPath: /deps}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: code
          configMap: {name: alert-bot-code}
        - {name: deps, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
