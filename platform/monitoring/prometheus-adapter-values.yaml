# prometheus-adapter (chart 5.3.0): cung cấp custom.metrics.k8s.io cho HPA theo request.
#   helm upgrade prometheus-adapter prometheus-community/prometheus-adapter -n monitoring --version 5.3.0 -f platform/monitoring/prometheus-adapter-values.yaml
# Nguồn số liệu: Prometheus riêng prometheus-hpa (platform/monitoring/prometheus-hpa-values.yaml), KHÔNG dùng Prometheus CMC.
# Recording rule kong_service:requests:rate2m đã là request/giây của từng Service, nhãn namespace/service khớp object Kubernetes.
prometheus:
  url: http://prometheus-hpa-server.monitoring.svc
  port: 80
  path: ""

rules:
  default: false
  custom:
    # HPA: type Object, describedObject = Service <svc>, metric http_requests_per_second.
    - seriesQuery: 'kong_service:requests:rate2m{namespace!="",service!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          service: {resource: "service"}
      name:
        matches: "^kong_service:requests:rate2m$"
        as: "http_requests_per_second"
      metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
