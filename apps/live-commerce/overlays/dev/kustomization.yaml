apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: live-commerce-dev
resources:
  - ../../base
  # - secrets/        # chỉ bật khi chuyển sang SealedSecret. Hiện Secret thường do scripts/deploy.sh tạo.
images:
  - name: 192.168.6.194/live-commerce/chat-service
    newTag: "0000000"   # scripts/deploy.sh / promote ghi đè
  - name: 192.168.6.194/live-commerce/product-service
    newTag: "0000000"   # scripts/deploy.sh / promote ghi đè
  - name: 192.168.6.194/live-commerce/order-service
    newTag: "0000000"   # scripts/deploy.sh / promote ghi đè
  - name: 192.168.6.194/live-commerce/auth-service
    newTag: "0000000"   # scripts/deploy.sh / promote ghi đè
  - name: 192.168.6.194/live-commerce/live-manager
    newTag: "0000000"   # scripts/deploy.sh / promote ghi đè
  - name: 192.168.6.194/live-commerce/web
    newTag: "0000000"   # scripts/deploy.sh / promote ghi đè
patches:
  - target:
      kind: Ingress
      name: kong-routes
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.live.example.com
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: chat-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: order-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
