apiVersion: v1
kind: Service
metadata:
  name: chat-service
  annotations:
    konghq.com/read-timeout: "3600000"
    konghq.com/write-timeout: "3600000"
  labels:
    app.kubernetes.io/name: chat-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chat-service
  ports:
    - name: http
      port: 80
      targetPort: http
