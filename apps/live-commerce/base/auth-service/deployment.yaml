apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: live-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: live-commerce
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: auth-service
          image: 192.168.6.194/live-commerce/auth-service:latest   # tag thật đặt trong overlay (images:)
          ports:
            - name: http
              containerPort: 3006
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret   # DATABASE_URL, JWT_SECRET
            - secretRef:
                name: object-storage   # S3_* (ảnh lên Object Storage CMC Cloud), tạo bởi scripts/deploy.sh
                optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
