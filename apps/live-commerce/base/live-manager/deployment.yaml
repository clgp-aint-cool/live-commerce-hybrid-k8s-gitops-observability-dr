apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-manager
  labels:
    app.kubernetes.io/name: live-manager
    app.kubernetes.io/part-of: live-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: live-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-manager
        app.kubernetes.io/part-of: live-commerce
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: live-manager
          image: 192.168.6.194/live-commerce/live-manager:latest   # tag thật đặt trong overlay (images:)
          ports:
            - name: http
              containerPort: 3005
          envFrom:
            - configMapRef:
                name: live-manager-config
            - secretRef:
                name: live-manager-secret   # DATABASE_URL, REDIS_URL, ADMIN_TOKEN, INTERNAL_API_TOKEN, [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
