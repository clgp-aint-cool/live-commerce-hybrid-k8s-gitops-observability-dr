apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # Request/giây qua Kong (prometheus-adapter, platform/monitoring/prometheus-adapter-values.yaml).
    # AverageValue: replicas = tổng rps / 50. nginx tĩnh ~0.4m CPU mỗi rps nên CPU gần như không bao giờ kích hoạt, chỉ metric này.
    # (Value sẽ nhân theo số pod hiện tại → scale mãi tới max.)
    - type: Object
      object:
        metric:
          name: http_requests_per_second
        describedObject:
          apiVersion: v1
          kind: Service
          name: web
        target:
          type: AverageValue
          averageValue: "50"
