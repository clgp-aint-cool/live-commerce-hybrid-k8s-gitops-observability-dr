apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # Request/giây qua Kong (prometheus-adapter, platform/monitoring/prometheus-adapter-values.yaml).
    # AverageValue: replicas = tổng rps / 20. Đo 2026-10-13 (scripts/loadtest): ~2-3m CPU mỗi rps, 20 rps ≈ 50% CPU request, p95 < 10ms.
    # (Value sẽ nhân theo số pod hiện tại → scale mãi tới max.)
    - type: Object
      object:
        metric:
          name: http_requests_per_second
        describedObject:
          apiVersion: v1
          kind: Service
          name: product-service
        target:
          type: AverageValue
          averageValue: "20"
