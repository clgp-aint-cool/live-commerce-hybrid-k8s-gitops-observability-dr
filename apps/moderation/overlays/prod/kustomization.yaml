apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: moderation
resources:
  - ../../base
  # - secrets/        # chỉ bật khi chuyển sang SealedSecret (harbor-registry, moderation-service-secret)
images:
  - name: 192.168.6.194/live-commerce/moderation-service
    newTag: "0000000"   # scripts/deploy.sh / promote ghi đè
patches:
  - target:
      kind: Service
      name: moderation-webhook
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30084
