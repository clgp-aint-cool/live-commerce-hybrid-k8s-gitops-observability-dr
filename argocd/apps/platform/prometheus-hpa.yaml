apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-hpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # trước prometheus-adapter (wave 2)
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: "29.36.0"
      helm:
        releaseName: prometheus-hpa
        valueFiles:
          - $values/platform/monitoring/prometheus-hpa-values.yaml
    - repoURL: https://github.com/clgp-aint-cool/live-commerce-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
