apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: haproxy-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://haproxytech.github.io/helm-charts
      chart: kubernetes-ingress
      targetRevision: "1.54.2"     # khớp scripts/install-edge.sh
      helm:
        releaseName: haproxy-ingress
        valueFiles:
          - $values/platform/haproxy-ingress/values.yaml
        parameters:
          # SealedSecret tls "cloudflare-origin-tls" trong namespace haproxy-ingress (xem scripts/install-edge.sh)
          - name: controller.defaultTLSSecret.secret
            value: cloudflare-origin-tls
    - repoURL: https://github.com/<ORG>/live-commerce-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: haproxy-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
