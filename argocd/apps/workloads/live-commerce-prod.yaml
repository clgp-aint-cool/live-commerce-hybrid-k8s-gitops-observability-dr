apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: live-commerce-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: live-commerce
  source:
    repoURL: https://github.com/<ORG>/live-commerce-infra.git
    targetRevision: main
    path: apps/live-commerce/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: live-commerce
  # prod: KHÔNG tự sync, người có quyền bấm Sync trên ArgoCD sau khi merge PR promote
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
