apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moderation-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: live-commerce
  source:
    repoURL: https://github.com/clgp-aint-cool/live-commerce-infra.git
    targetRevision: main
    path: apps/moderation/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: moderation
  # HPA quyết định số pod: ArgoCD bỏ qua replicas, kể cả khi selfHeal/sync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  # prod: duyệt PR promote là cổng duy nhất, merge xong ArgoCD tự sync.
  # selfHeal: sửa tay trên cluster bị trả về theo git. prune tắt: resource bị xóa khỏi git
  # không tự xóa trên cluster (bật khi đã quen luồng, xóa tay hoặc Sync với Prune trên UI).
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
