apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moderation-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: live-commerce
  source:
    repoURL: https://github.com/clgp-aint-cool/live-commerce-infra.git
    targetRevision: main
    path: apps/moderation/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: moderation-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
